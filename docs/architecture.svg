  <text x="480" y="220" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif">清洗 · 特徵 · 個資雜湊</text>
  <text x="480" y="244" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">local only · hmac-sha256</text>
  <text x="424" y="268" fill="#7a8399" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif">洩漏檢查 · 個資檢查 · 禁用欄位</text>
  <rect x="760" y="164" width="304" height="128" rx="8" fill="#f5f5f5"/>
  <rect x="760" y="164" width="304" height="128" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1.2"/>
