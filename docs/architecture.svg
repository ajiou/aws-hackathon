  <g transform="translate(112,208) scale(1.7)" color="#4f5d75"><use href="#ic-db"/></g>
  <rect x="284" y="180" width="44" height="16" rx="3" fill="transparent" stroke="rgba(122,131,153,0.9)" stroke-width="1"/>
  <text x="306" y="192" fill="rgba(122,131,153,0.9)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
  <text x="168" y="220" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist','Noto Sans TC',sans-serif">六個公開資料源</text>
  <text x="168" y="244" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">1,178 parks</text>
  <text x="112" y="268" fill="#7a8399" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif">基本 · 評鑑 · 裁罰 · 收費 · 財報 · 輿情</text>
  <rect x="400" y="164" width="304" height="128" rx="8" fill="#f5f5f5"/>
