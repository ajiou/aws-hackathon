<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1240 736" role="img" aria-labelledby="arch-title arch-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="arch-title">小小守護員系統架構</title>
  <desc id="arch-desc">上方為每日一次的離線批次層：六個公開資料源經過 ETL 與個資雜湊，交由 Bedrock 與 SageMaker 運算，結果寫入 S3 資料層。下方為線上服務層：稽查員經 CloudFront 取得前端與 API，Lambda 只讀取 S3 上算好的靜態分數，不做線上推論。</desc>

  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+TC:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>

    <g id="ic-db" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 6a8 3 0 1 0 16 0a8 3 0 1 0 -16 0"/><path d="M4 6v6a8 3 0 0 0 16 0v-6"/><path d="M4 12v6a8 3 0 0 0 16 0v-6"/>
    </g>
    <g id="ic-lock" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-6"/><path d="M11 16a1 1 0 1 0 2 0a1 1 0 0 0 -2 0"/><path d="M8 11v-4a4 4 0 1 1 8 0v4"/>
    </g>
    <g id="ic-robot" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 6a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v4a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2l0 -4"/><path d="M12 2v2"/><path d="M9 12v9"/><path d="M15 12v9"/><path d="M5 16l4 -2"/><path d="M15 14l4 2"/><path d="M9 18h6"/><path d="M10 8v.01"/><path d="M14 8v.01"/>
    </g>
    <g id="ic-bucket" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 7a8 4 0 1 0 16 0a8 4 0 1 0 -16 0"/><path d="M4 7c0 .664 .088 1.324 .263 1.965l2.737 10.035c.5 1.5 2.239 2 5 2s4.5 -.5 5 -2c.333 -1 1.246 -4.345 2.737 -10.035a7.45 7.45 0 0 0 .263 -1.965"/>
    </g>
    <g id="ic-users" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 7a4 4 0 1 0 8 0a4 4 0 1 0 -8 0"/><path d="M3 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M21 21v-2a4 4 0 0 0 -3 -3.85"/>
    </g>
    <g id="ic-cdn" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19.5 7a9 9 0 0 0 -7.5 -4a8.991 8.991 0 0 0 -7.484 4"/><path d="M11.5 3a16.989 16.989 0 0 0 -1.826 4"/><path d="M12.5 3a16.989 16.989 0 0 1 1.828 4"/><path d="M19.5 17a9 9 0 0 1 -7.5 4a8.991 8.991 0 0 1 -7.484 -4"/><path d="M11.5 21a16.989 16.989 0 0 1 -1.826 -4"/><path d="M12.5 21a16.989 16.989 0 0 0 1.828 -4"/><path d="M2 10l1 4l1.5 -4l1.5 4l1 -4"/><path d="M17 10l1 4l1.5 -4l1.5 4l1 -4"/>
    </g>
    <g id="ic-api" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 4a2 2 0 0 0 -2 2v3a2 3 0 0 1 -2 3a2 3 0 0 1 2 3v3a2 2 0 0 0 2 2"/><path d="M17 4a2 2 0 0 1 2 2v3a2 3 0 0 0 2 3a2 3 0 0 0 -2 3v3a2 2 0 0 1 -2 2"/>
    </g>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- ===================== ZONES ===================== -->
  <rect x="40" y="104" width="1160" height="184" rx="8"
        fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="64" y="108" width="228" height="12" rx="2" fill="#f5f5f5"/>
  <text x="178" y="117" fill="rgba(45,49,66,0.40)" font-size="7"
        font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">OFFLINE BATCH · ONCE A DAY</text>

  <rect x="40" y="388" width="1160" height="192" rx="8"
        fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="64" y="392" width="248" height="12" rx="2" fill="#f5f5f5"/>
  <text x="188" y="401" fill="rgba(45,49,66,0.40)" font-size="7"
        font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ONLINE SERVING · READ-ONLY</text>

  <!-- ===================== ARROWS ===================== -->
  <line x1="292" y1="196" x2="356" y2="196" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <line x1="620" y1="196" x2="684" y2="196" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="620" y="164" width="64" height="12" rx="2" fill="#f5f5f5"/>
  <text x="652" y="173" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace"
        text-anchor="middle" letter-spacing="0.06em">HASHED</text>

  <line x1="948" y1="196" x2="1012" y2="196" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="948" y="164" width="64" height="12" rx="2" fill="#f5f5f5"/>
  <text x="980" y="173" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
        text-anchor="middle" letter-spacing="0.06em">WRITE</text>

  <line x1="292" y1="480" x2="356" y2="480" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <rect x="292" y="448" width="64" height="12" rx="2" fill="#f5f5f5"/>
  <text x="324" y="457" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
        text-anchor="middle" letter-spacing="0.06em">HTTPS</text>

  <!-- CloudFront -> S3 site (up) -->
  <path d="M 620 460 H 644 Q 652 460 652 452 V 448 Q 652 440 660 440 H 684"
        fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="616" y="412" width="56" height="12" rx="2" fill="#f5f5f5"/>
  <text x="644" y="421" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
        text-anchor="middle" letter-spacing="0.06em">OAC</text>

  <!-- CloudFront -> API (down) -->
  <path d="M 620 500 H 644 Q 652 500 652 508 V 520 Q 652 528 660 528 H 684"
        fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <rect x="604" y="536" width="72" height="12" rx="2" fill="#f5f5f5"/>
  <text x="640" y="545" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
        text-anchor="middle" letter-spacing="0.06em">/API/*</text>

  <!-- Lambda reads S3 data -->
  <path d="M 948 528 H 1092 Q 1100 528 1100 520 V 268"
        fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="1112" y="360" width="88" height="12" rx="2" fill="#f5f5f5"/>
  <text x="1156" y="369" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
        text-anchor="middle" letter-spacing="0.06em">READ SERVING/</text>

  <!-- ===================== NODES ===================== -->
  <!-- 1 sources -->
  <rect x="80" y="148" width="212" height="96" rx="6" fill="#f5f5f5"/>
  <rect x="80" y="148" width="212" height="96" rx="6"
        fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
  <g transform="translate(100,184)" color="#4f5d75"><use href="#ic-db"/></g>
  <rect x="244" y="156" width="40" height="12" rx="2" fill="transparent"
        stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
  <text x="264" y="165" fill="rgba(122,131,153,0.9)" font-size="7"
        font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
  <text x="136" y="196" fill="#2d3142" font-size="13" font-weight="600"
        font-family="'Geist','Noto Sans TC',sans-serif">六個公開資料源</text>
  <text x="136" y="214" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">1,178 parks</text>
  <text x="100" y="232" fill="#7a8399" font-size="9"
        font-family="'Geist','Noto Sans TC',sans-serif">基本 · 評鑑 · 裁罰 · 收費 · 財報 · 輿情</text>

  <!-- 2 ETL — FOCAL -->
  <rect x="356" y="148" width="264" height="96" rx="6" fill="#f5f5f5"/>
  <rect x="356" y="148" width="264" height="96" rx="6"
        fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <g transform="translate(376,184)" color="#eb6c36"><use href="#ic-lock"/></g>
  <rect x="572" y="156" width="32" height="12" rx="2" fill="transparent"
        stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
  <text x="588" y="165" fill="rgba(235,108,54,0.95)" font-size="7"
        font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ETL</text>
  <text x="412" y="196" fill="#2d3142" font-size="13" font-weight="600"
        font-family="'Geist','Noto Sans TC',sans-serif">清洗 · 特徵 · 個資雜湊</text>
  <text x="412" y="214" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">local only · hmac-sha256</text>
  <text x="376" y="232" fill="#7a8399" font-size="9"
        font-family="'Geist','Noto Sans TC',sans-serif">洩漏檢查 · 個資檢查 · 禁用欄位</text>

  <!-- 3 offline compute -->
  <rect x="684" y="148" width="264" height="96" rx="6" fill="#f5f5f5"/>
  <rect x="684" y="148" width="264" height="96" rx="6"
        fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <g transform="translate(704,184)" color="#2d3142"><use href="#ic-robot"/></g>
  <rect x="900" y="156" width="32" height="12" rx="2" fill="transparent"
        stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="916" y="165" fill="rgba(45,49,66,0.75)" font-size="7"
        font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AWS</text>
  <text x="740" y="196" fill="#2d3142" font-size="13" font-weight="600"
        font-family="'Geist','Noto Sans TC',sans-serif">離線運算</text>
  <text x="740" y="214" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">bedrock · sagemaker</text>
  <text x="704" y="232" fill="#7a8399" font-size="9"
        font-family="'Geist','Noto Sans TC',sans-serif">輿情標註 2,900 篇 · 訓練與回測</text>

  <!-- 4 S3 data -->
  <rect x="1012" y="148" width="164" height="120" rx="6" fill="#f5f5f5"/>
  <rect x="1012" y="148" width="164" height="120" rx="6"
        fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <g transform="translate(1032,164)" color="#4f5d75"><use href="#ic-bucket"/></g>
  <rect x="1128" y="156" width="28" height="12" rx="2" fill="transparent"
        stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
  <text x="1142" y="165" fill="rgba(79,93,117,0.9)" font-size="7"
        font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">S3</text>
  <text x="1032" y="212" fill="#2d3142" font-size="13" font-weight="600"
        font-family="'Geist','Noto Sans TC',sans-serif">資料層</text>
  <text x="1032" y="230" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">serving/*.json</text>
  <text x="1032" y="246" fill="#7a8399" font-size="9"
        font-family="'Geist','Noto Sans TC',sans-serif">算好的分數 · 約 3 MB</text>
  <text x="1032" y="260" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">private · bpa on</text>

  <!-- 5 inspector -->
  <rect x="80" y="432" width="212" height="96" rx="6" fill="#f5f5f5"/>
  <rect x="80" y="432" width="212" height="96" rx="6"
        fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
  <g transform="translate(100,468)" color="#4f5d75"><use href="#ic-users"/></g>
  <rect x="244" y="440" width="36" height="12" rx="2" fill="transparent"
        stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
  <text x="262" y="449" fill="rgba(122,131,153,0.9)" font-size="7"
        font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
  <text x="136" y="480" fill="#2d3142" font-size="13" font-weight="600"
        font-family="'Geist','Noto Sans TC',sans-serif">教育局稽查人員</text>
  <text x="136" y="498" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">50 slots / week</text>
  <text x="100" y="516" fill="#7a8399" font-size="9"
        font-family="'Geist','Noto Sans TC',sans-serif">每週產出一份稽查派工單</text>

  <!-- 6 CloudFront -->
  <rect x="356" y="432" width="264" height="96" rx="6" fill="#f5f5f5"/>
  <rect x="356" y="432" width="264" height="96" rx="6"
        fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <g transform="translate(376,468)" color="#2d3142"><use href="#ic-cdn"/></g>
  <rect x="572" y="440" width="32" height="12" rx="2" fill="transparent"
        stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="588" y="449" fill="rgba(45,49,66,0.75)" font-size="7"
        font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CDN</text>
  <text x="412" y="480" fill="#2d3142" font-size="13" font-weight="600"
        font-family="'Geist','Noto Sans TC',sans-serif">CloudFront + OAC</text>
  <text x="412" y="498" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">api ttl 60s</text>
  <text x="376" y="516" fill="#7a8399" font-size="9"
        font-family="'Geist','Noto Sans TC',sans-serif">SPA 路由用 CloudFront Function</text>

  <!-- 7 S3 site -->
  <rect x="684" y="412" width="264" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="684" y="412" width="264" height="56" rx="6"
        fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <g transform="translate(704,428)" color="#4f5d75"><use href="#ic-bucket"/></g>
  <rect x="900" y="420" width="28" height="12" rx="2" fill="transparent"
        stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
  <text x="914" y="429" fill="rgba(79,93,117,0.9)" font-size="7"
        font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">S3</text>
  <text x="740" y="436" fill="#2d3142" font-size="13" font-weight="600"
        font-family="'Geist','Noto Sans TC',sans-serif">前端靜態站</text>
  <text x="740" y="454" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">private · no website hosting</text>

  <!-- 8 API GW + Lambda -->
  <rect x="684" y="500" width="264" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="684" y="500" width="264" height="56" rx="6"
        fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <g transform="translate(704,516)" color="#2d3142"><use href="#ic-api"/></g>
  <rect x="900" y="508" width="32" height="12" rx="2" fill="transparent"
        stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="916" y="517" fill="rgba(45,49,66,0.8)" font-size="7"
        font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
  <text x="740" y="524" fill="#2d3142" font-size="13" font-weight="600"
        font-family="'Geist','Noto Sans TC',sans-serif">API Gateway + Lambda</text>
  <text x="740" y="542" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">9 routes · 512mb · read-only iam</text>

  <!-- ===================== CALLOUTS ===================== -->
  <text x="488" y="84" fill="#eb6c36" font-size="15" font-style="italic"
        font-family="'Instrument Serif', serif" text-anchor="middle">姓名在這裡變成雜湊值，不越過這一格</text>
  <path d="M 488 92 Q 488 116 488 140" fill="none"
        stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="488" cy="144" r="2.5" fill="#eb6c36"/>

  <text x="1200" y="624" fill="#2d3142" font-size="15" font-style="italic"
        font-family="'Instrument Serif', serif" text-anchor="end">沒有 SageMaker Endpoint — 雲端只讀算好的檔</text>
  <path d="M 1004 612 Q 976 588 952 560" fill="none"
        stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="948" cy="556" r="2.5" fill="#2d3142"/>

  <!-- ===================== LEGEND ===================== -->
  <line x1="40" y1="672" x2="1200" y2="672" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="40" y="692" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace"
        letter-spacing="0.14em">LEGEND</text>

  <rect x="140" y="680" width="20" height="12" rx="2"
        fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <text x="168" y="692" fill="#4f5d75" font-size="9"
        font-family="'Geist','Noto Sans TC',sans-serif">個資邊界</text>

  <rect x="256" y="680" width="20" height="12" rx="2"
        fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <text x="284" y="692" fill="#4f5d75" font-size="9"
        font-family="'Geist','Noto Sans TC',sans-serif">S3 儲存（private）</text>

  <rect x="424" y="680" width="20" height="12" rx="2"
        fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="452" y="692" fill="#4f5d75" font-size="9"
        font-family="'Geist','Noto Sans TC',sans-serif">AWS 受管服務</text>

  <line x1="576" y1="688" x2="608" y2="688" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <text x="620" y="692" fill="#4f5d75" font-size="9"
        font-family="'Geist','Noto Sans TC',sans-serif">HTTPS 請求</text>

  <line x1="732" y1="688" x2="764" y2="688" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="776" y="692" fill="#4f5d75" font-size="9"
        font-family="'Geist','Noto Sans TC',sans-serif">資料流</text>

  <line x1="868" y1="688" x2="900" y2="688" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <text x="912" y="692" fill="#4f5d75" font-size="9"
        font-family="'Geist','Noto Sans TC',sans-serif">已雜湊的資料</text>
</svg>
