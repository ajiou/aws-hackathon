  <text x="840" y="244" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">bedrock · sagemaker</text>
  <text x="784" y="268" fill="#7a8399" font-size="12" font-family="'Geist','Noto Sans TC',sans-serif">輿情標註 2,900 篇 · 訓練與回測</text>
  <rect x="1120" y="164" width="236" height="176" rx="8" fill="#f5f5f5"/>
  <rect x="1120" y="164" width="236" height="176" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1.2"/>
