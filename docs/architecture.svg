<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1440 848" role="img" aria-labelledby="arch-title arch-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="arch-title">小小守護員系統架構</title>
  <desc id="arch-desc">上方為每日一次的離線批次層：六個公開資料源經過 ETL 與個資雜湊，交由 Bedrock 與 SageMaker 運算，結果寫入 S3 資料層。下方為線上服務層：稽查員經 CloudFront 取得前端與 API，Lambda 只讀取 S3 上算好的靜態分數，不做線上推論。</desc>

  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+TC:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
