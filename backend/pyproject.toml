[project]
name = "aws-hackathon-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34,<2",
    "fastapi>=0.141.1",
    "mangum>=0.19,<1",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
extend-select = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]
